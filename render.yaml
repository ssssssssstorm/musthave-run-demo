# Online leaderboard backend for MUSTHAVE RUN.
# The game itself stays on the existing static site (musthave-run.onrender.com), not managed here.
databases:
  - name: musthave-run-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: musthave_run_db
    user: musthave_run_db_user
    ipAllowList: []

services:
  - type: web
    name: musthave-run-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: musthave-run-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://musthave-run.onrender.com,https://ssssssssstorm.github.io
      - key: NODE_VERSION
        value: "22"
